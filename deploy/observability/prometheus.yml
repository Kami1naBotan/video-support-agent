global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s

scrape_configs:
  - job_name: video-support-agent-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9464
        labels:
          process_role: api

  - job_name: video-support-agent-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9465
        labels:
          process_role: worker