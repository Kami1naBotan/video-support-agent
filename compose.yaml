name: bili-support

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: bili_support
      MYSQL_USER: bili_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
  nginx:
    profiles: [ "app" ]
    image: video-support-agent-frontend:local
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    stop_grace_period: 75s

volumes:
  mysql_data:
  redis_data:
